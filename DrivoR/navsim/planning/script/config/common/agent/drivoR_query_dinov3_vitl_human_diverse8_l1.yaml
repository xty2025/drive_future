defaults:
  - drivoR_query_dinov3_vitl
  - _self_

# Human L1 + 0.5 * selected diverse8 L1 coverage + score loss.
# No long GT, old top4 GT, or future register prediction.
config:
  long_trajectory_additional_poses: 0
  pseudo_expert:
    enabled: true
    source: diverse8
    path: ${oc.env:DRIVOR_DIVERSE8_GT_ROOT,/cpfs29jb/data/zhaozc/project/Cosmos3forMultiGT/runtime/multigt_raw64/outputs/navtrain_diverse8_dense_0p1s_f64}
    # Searched when the main root lacks a scene: the 205 navtrain scenes with only 3 history frames.
    fallback_paths: ${oc.env:DRIVOR_DIVERSE8_GT_FALLBACK_ROOTS,/cpfs29jb/data/zhaozc/project/Cosmos3forMultiGT/runtime/multigt_raw64/outputs/navtrain_diverse8_hist3_dense_0p1s_f64}
    top_k: 8
    loss_type: l1
    weight: 0.5
    missing_policy: ignore
