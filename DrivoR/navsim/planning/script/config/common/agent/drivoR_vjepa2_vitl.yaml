defaults:
  - drivoR
  - _self_

config:
  cam_f0: [3]
  cam_l0: []
  cam_l1: []
  cam_l2: []
  cam_r0: []
  cam_r1: []
  cam_r2: []
  cam_b0: []
  lidar_pc: []
