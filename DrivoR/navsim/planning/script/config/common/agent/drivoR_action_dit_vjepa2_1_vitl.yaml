defaults:
  - drivoR_action_dit_multigt
  - _self_

config:
  image_size: [1152, 672]
  multi_gt:
    matching: nearest
    weighting: equal
  image_backbone:
    family: vjepa2_1
    model_name: vjepa2_1_vit_large_384
    model_weights: ${oc.env:DRIVOR_VJEPA2_1_VITL_WEIGHTS,weights/vjepa2_1/vitl/ema_encoder.safetensors}
    use_lora: true
    lora_rank: 32
    finetune: false
