defaults:
  - drivoR
  - _self_

_target_: navsim.agents.drivoR_pseudo_expert.agent.DrivoRPseudoExpertAgent

# Original four-view DINOv2 + 16 queries/view + original trajectory/scoring heads.
# Only add CLOVER Stage-1 coverage on the final 64 proposals.
config:
  pseudo_expert:
    path: ${oc.env:DRIVOR_PSEUDO_EXPERT_PACK,${oc.env:NAVSIM_EXP_ROOT}/clover_data/pseudo_experts_k8_thr0p8}
    top_k: 8
    score_thr: 0.8

loss:
  _target_: navsim.agents.drivoR_pseudo_expert.loss.DrivoRPseudoExpertLoss
  pseudo_expert_weight: 0.5
