# Inheritable counterpart of half_training; Hydra searchpath belongs only to
# each primary half_<experiment>.yaml. Keep the original half entry untouched.
defaults:
  - training_runtime_defaults
  - override /train_test_split: navtrain_half
  - _self_

cache_path: null
use_cache_without_dataset: false
auto_resume: false
seed: 2
trainer:
  params:
    num_nodes: 8
    devices: 8
    max_epochs: 25
    accumulate_grad_batches: 1
    precision: bf16-mixed
dataloader:
  params:
    batch_size: 1
runtime:
  scheduler_dataset_size_from_data: true
agent:
  num_gpus: 64
  scheduler_args:
    dataset_size: 42555
